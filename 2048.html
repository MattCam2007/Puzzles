<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2048</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/2048.css">
</head>
<body>

<div class="header">
  <div class="title">2048</div>
  <div class="header-right">
    <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">Best</div> <div class="value" id="best">0</div></div>
    <div class="puzzle-switcher-wrap">
      <button class="icon-btn puzzle-switcher-btn" id="puzzleSwitcherBtn" title="Switch puzzle">☰</button>
      <div class="puzzle-dropdown" id="puzzleDropdown">
        <a href="2048.html" class="puzzle-option">🔢 2048</a>
        <a href="sudoku.html" class="puzzle-option">✏️ Sudoku</a>
        <a href="kakuro.html" class="puzzle-option">➕ Kakuro</a>
      </div>
    </div>
    <button class="icon-btn" id="settingsBtn">⚙️</button>
  </div>
</div>

<div class="board-top-bar">
  <div class="board-top-left">
    <button class="btn accent" id="newGameBtn">New game</button>
  </div>
  <div class="board-top-right">
    <button class="btn-top" id="undoBtn">↩ Undo</button>
  </div>
</div>

<div class="board-wrap">
  <div class="bg-grid" id="bgGrid"></div>
  <div id="tc"></div>
  <canvas id="fx"></canvas>
</div>

<!-- SETTINGS PANEL -->
<div class="settings-backdrop" id="settingsBackdrop"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-handle"></div>
  <div class="settings-title">Settings</div>

  <!-- Appearance + Background sections injected by ui/shared-sections.js -->
  <div data-shared-settings></div>

  <div class="settings-section">
    <div class="settings-section-label">Animation Style</div>
    <div id="animPicker"></div>
  </div>

  <div class="settings-section">
    <div class="settings-section-label">Tile Style</div>
    <div id="tilePicker"></div>
  </div>
</div>

<div class="banner" id="banner">
  <div class="banner-left">
    <div class="banner-title" id="bannerTitle">Game Over</div>
    <div class="banner-sub"   id="bannerSub">No moves left</div>
  </div>
  <div class="banner-btns">
    <button class="btn-top" id="keepGoingBtn" style="display:none">Keep going</button>
    <button class="btn accent" id="bannerNewBtn">New game</button>
  </div>
</div>

<div class="foot">
  <span class="kb-only">Arrow keys · WASD · </span>Swipe or use keys · reach <strong>2048</strong>
</div>

<script type="module" src="js/pages/2048.js"></script>
</body>
</html>
