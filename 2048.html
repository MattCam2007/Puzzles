<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2048</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/2048.css">
</head>
<body>

<div class="header">
  <div class="title">2048</div>
  <div class="header-right">
    <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">Best</div> <div class="value" id="best">0</div></div>
  </div>
</div>

<div class="board-top-bar">
  <div class="board-top-left">
    <div class="anim-wrap">
      <button class="btn-top anim-btn" id="animBtn" onclick="toggleAnimMenu()">
        <span id="animLabel">✨ Clean</span>
        <span class="chevron">▾</span>
      </button>
      <div class="anim-menu" id="animMenu"></div>
    </div>
    <div class="anim-wrap">
      <button class="btn-top anim-btn" id="tileBtn" onclick="toggleTileMenu()">
        <span id="tileLabel">🔢 Numbers</span>
        <span class="chevron">▾</span>
      </button>
      <div class="anim-menu" id="tileMenu"></div>
    </div>
  </div>
  <div class="board-top-right">
    <button class="btn-top" id="undoBtn" onclick="undo()">↩ Undo</button>
    <button class="btn accent" id="newGameBtn" onclick="newGame()">New game</button>
  </div>
</div>

<div class="board-wrap">
  <div class="bg-grid" id="bgGrid"></div>
  <div id="tc"></div>
  <canvas id="fx"></canvas>
</div>

<div class="banner" id="banner">
  <div class="banner-left">
    <div class="banner-title" id="bannerTitle">Game Over</div>
    <div class="banner-sub"   id="bannerSub">No moves left</div>
  </div>
  <div class="banner-btns">
    <button class="btn-top" id="keepGoingBtn" onclick="keepGoing()" style="display:none">Keep going</button>
    <button class="btn accent" onclick="newGame()">New game</button>
  </div>
</div>

<div class="foot">
  <span class="kb-only">Arrow keys · WASD · </span>Swipe or use keys · reach <strong>2048</strong>
</div>

<script src="js/common.js"></script>
<script src="js/2048.js"></script>
</body>
</html>
